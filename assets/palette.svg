  <text x="32" y="352" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#14161b">Light</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <g transform="translate(32 372)">
      <rect width="72" height="32" rx="4" fill="#a6dbff"/><text x="84" y="21" fill="#14161b">blue #a6dbff</text>
    </g>
    <g transform="translate(198 372)">
      <rect width="72" height="32" rx="4" fill="#8cf8f7"/><text x="84" y="21" fill="#14161b">cyan #8cf8f7</text>
