    </g>
    <g transform="translate(32 410)">
      <rect width="72" height="32" rx="4" fill="#c4c6cd"/><text x="84" y="21" fill="#14161b">grey3 #c4c6cd</text>
    </g>
    <g transform="translate(198 410)">
      <rect width="72" height="32" rx="4" fill="#9b9ea4"/><text x="84" y="21" fill="#14161b">grey4 #9b9ea4</text>
    </g>
    <g transform="translate(364 410)">
      <rect width="72" height="32" rx="4" fill="#ffcaff"/><text x="84" y="21" fill="#14161b">magenta #ffcaff</text>
    </g>
    <g transform="translate(530 410)">
      <rect width="72" height="32" rx="4" fill="#ffc0b9"/><text x="84" y="21" fill="#14161b">red #ffc0b9</text>
    </g>
    <g transform="translate(696 410)">
